spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      username: ${REDIS_USERNAME:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: ${REDIS_TIMEOUT_MS:2000}ms

management:
  endpoint:
    health:
      show-details: always

app:
  mentor:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5-coder:latest}
      timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:60}
    cloud:
      api-key: ${GROQ_API_KEY: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}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      model: ${GROQ_MODEL:qwen/qwen3.8-27b}
      timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
  security:
    jwt:
      secret: ${JWT_SECRET:developmentSecretKeyChangeMeForProductionUseOnlyAtLeast256BitsLong12345}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:${JWT_EXPIRATION_MS:900000}}
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    oauth2:
      google:
        client-id: ${GOOGLE_CLIENT_ID:}

logging:
  level:
    root: INFO
    com.aicodingmentor: INFO

