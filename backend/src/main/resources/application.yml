server:
  port: ${PORT:8081}

spring:
  application:
    name: ai-coding-mentor-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:465}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          auth: true
          ssl:
            enable: true
            trust: "*"
          starttls:
            enable: false
          socketFactory:
            port: ${SPRING_MAIL_PORT:${MAIL_PORT:465}}
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  data:
    redis:
      repositories:
        enabled: false
      url: ${REDIS_URL:rediss://default:gQAAAAAAAu-MAAIgcDE1MThhMDllNGI4NzM0YzY0YWJjMThmNjgwNzliN2I1Mw@cheerful-bedbug-192396.upstash.io:6379}
      timeout: ${REDIS_TIMEOUT_MS:5000}ms

app:
  mail:
    from: ${APP_MAIL_FROM:CodingFriend <shivkumarthakur9693@gmail.com>}
    enabled: ${MAIL_ENABLED:true}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

brevo:
  api-key: ${BREVO_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
