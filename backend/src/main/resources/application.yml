server:
  port: ${PORT:8081}

spring:
  application:
    name: ai-coding-mentor-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    redis:
      repositories:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
